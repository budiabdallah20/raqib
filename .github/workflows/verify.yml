name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# سلاح ضد الندوبليه — آخر ران في نفس الفرع يجري ودي التي تحذف
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: type-check · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Test (Vitest)
        run: npm run test

      - name: Build (Next.js)
        run: npm run build
        env:
          DATABASE_URL: 'file:./dev.db'
          JWT_SECRET: 'ci-only-secret-for-build-min-32-chars'
          TRUST_PROXY: '1'
